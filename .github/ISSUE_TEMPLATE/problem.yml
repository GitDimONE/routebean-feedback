name: Report a problem
description: Something didn't work, looked wrong, or was confusing.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        English and Russian are welcome. Можно писать по-русски.
        This repository is public. Remove personal details, passwords, tokens, and private screenshots.
        For a private report, use Help → Send feedback in RouteBean and keep visibility set to Private.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe what you did and what you saw. A cropped screenshot can help; remove private details first.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open…
        2. Choose…
        3. See…
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
  - type: input
    id: where
    attributes:
      label: Where in the app?
      placeholder: e.g. Garage, adding a bike, booking a service
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Phone
        - Tablet
        - Computer
  - type: checkboxes
    id: public-report
    attributes:
      label: Public visibility
      options:
        - label: I understand this report and its attachments will be public, and have removed private information.
          required: true
